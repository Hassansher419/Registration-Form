<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
            <h1>Registration Form</h1>
            <form action="/submit" method="POST">

                <input type="text" class="input" name="username" placeholder="Username" required><br><br>
    
                <input type="email" class="input" name="email" placeholder="Email" required><br><br>
    
                <input type="text" class="input" id="country" name="country" placeholder="Country" required><br><br>

                <input type="tel" class="input" id="phone" name="phone" placeholder="Phone" required><br><br>

                <input type="password" class="input" id="password" name="password" placeholder="Password" required><br><br>

                <div class="term">
                <input type="checkbox" class="input" id="terms" name="terms" required>
                <span for="terms">I agree to the terms and conditions</span><br><br>
                </div>

                <button type="submit">CREATE ACCOUNT</button>
            </form>
    </div>
</body>
</html>
